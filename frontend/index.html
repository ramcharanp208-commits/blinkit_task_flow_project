<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Blinkit Ops Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header (position: sticky applied in CSS) -->
  <header class="app-header">
    <div class="header-container">
      <h1>TaskFlow</h1>
      <p class="subtitle">Blinkit Operations &amp; Engineering Pod</p>
    </div>
  </header>

  <main class="main-content">

    <!-- ── Create / Quick-Add Task Panel (sticky) ─────────────────────── -->
    <section class="task-form-card" aria-label="Create new task">
      <h2>Create New Task</h2>

      <form id="taskForm" novalidate>
        <!-- Title -->
        <div class="form-group">
          <label for="taskTitle">Task Title *</label>
          <input
            type="text"
            id="taskTitle"
            placeholder="e.g. Verify shelf inventory for Pod B"
            autocomplete="off"
          />
          <div id="titleError" class="error-message" role="alert" aria-live="polite" style="display:none;"></div>
        </div>

        <!-- Priority / Due Date / Project -->
        <div class="form-row">
          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="medium">Medium</option>
              <option value="low">Low</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskDueDate">Due Date / Hint</label>
            <input
              type="text"
              id="taskDueDate"
              placeholder="e.g. 2026-08-20 or next friday"
            />
          </div>

          <div class="form-group">
            <label for="projectId">Project ID</label>
            <input type="number" id="projectId" value="1" min="1" />
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn btn-primary">
            Add Task
          </button>
          <button type="button" id="quickAddBtn" class="btn btn-secondary">
            AI Quick-Add
          </button>
        </div>
      </form>
    </section>

    <!-- ── Task List ───────────────────────────────────────────────────── -->
    <section class="task-list-section" aria-label="Active tasks">
      <div class="list-header">
        <h2>Active Tasks</h2>
        <div class="sort-controls">
          <button id="sortPriorityBtn" class="btn btn-small">
            Sort by Priority
          </button>
          <button id="refreshBtn" class="btn btn-small">
            Refresh
          </button>
        </div>
      </div>

      <!-- Status banner shown while fetching -->
      <div id="statusBanner" class="status-banner" style="display:none;"></div>

      <div id="taskListContainer" class="task-list-container">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
